<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DK AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#050816;color:#fff;height:100vh}
.app{height:100vh;display:flex;flex-direction:column;max-width:700px;margin:auto;background:#0c1224}
header{padding:12px 16px;border-bottom:1px solid #26304a;display:flex;align-items:center;gap:12px;background:#0a1020}
.logo{width:48px;height:48px;border-radius:14px;object-fit:cover;box-shadow:0 0 18px #008cff66}
.title{font-size:20px;font-weight:700}.sub{font-size:12px;color:#9aa5bd;margin-top:2px}
.chat{flex:1;overflow:auto;padding:22px 16px}
.welcome{text-align:center;margin-top:12vh}.hero-logo{width:120px;height:120px;border-radius:30px;object-fit:cover;box-shadow:0 0 35px #008cff66}
.welcome h1{font-size:30px;margin:16px 0 8px}.welcome p{color:#9aa5bd;line-height:1.5}
.msg{display:flex;margin:12px 0}.msg.user{justify-content:flex-end}
.bubble{max-width:82%;padding:12px 14px;border-radius:16px;line-height:1.45;white-space:pre-wrap}
.ai .bubble{background:#1b253d;border-top-left-radius:5px}
.user .bubble{background:#4f46e5;border-top-right-radius:5px}
.inputbar{padding:12px;border-top:1px solid #26304a;display:flex;gap:8px;background:#0a1020}
textarea{flex:1;resize:none;background:#192238;color:#fff;border:1px solid #2c3855;border-radius:14px;padding:12px;font-size:15px;outline:none}
button{border:0;border-radius:14px;background:#5b50e6;color:#fff;padding:0 18px;font-weight:bold}
button:active{transform:scale(.97)}
.note{text-align:center;color:#68738b;font-size:10px;padding:0 0 8px}
</style>
</head>

const welcome=document.getElementById("welcome");

input.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){e.preventDefault();sendMessage();}
});

function addMessage(text,type){
  if(welcome) welcome.style.display="none";
  const row=document.createElement("div");
  row.className="msg "+type;
  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.textContent=text;
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop=chat.scrollHeight;
}

function sendMessage(){
  const text=input.value.trim();
  if(!text)return;
  addMessage(text,"user");
  input.value="";
  setTimeout(()=>{
    addMessage("আমি DK AI-এর prototype। এখনো আমার AI brain/API যুক্ত করা হয়নি। পরের ধাপে আমরা আসল AI brain যুক্ত করব।","ai");
  },500);
}
</script>
</body>
</html>
