<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DK AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#fff;height:100vh;display:flex;flex-direction:column}
header{height:64px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #28304a;background:#10172b}.logo{font-size:22px;font-weight:800}.status{margin-left:auto;font-size:12px;color:#7ff0b2}
main{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}.msg{max-width:82%;padding:12px 15px;border-radius:16px;line-height:1.45;white-space:pre-wrap}.ai{align-self:flex-start;background:#18213a}.user{align-self:flex-end;background:#3157d5}.empty{text-align:center;margin:auto;color:#8f9ab5}
footer{padding:12px;border-top:1px solid #28304a;background:#10172b}.row{display:flex;gap:8px;align-items:center}
input[type=text]{flex:1;background:#171f35;color:#fff;border:1px solid #36415f;border-radius:14px;padding:13px 14px;outline:none}button{border:0;border-radius:12px;padding:11px 14px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.file{display:none}.small{font-size:12px;color:#8793ad;margin-top:7px}
</style>
</head>
<body>
<header><div class="logo">DK AI</div><div class="status">● Online</div></header>
<main id="chat"><div class="empty" id="empty"><h2>How can I help you?</h2><p>Ask DK AI anything.</p></div></main>
<footer>
<div class="row">
<button type="button" onclick="document.getElementById('fileInput').click()">＋</button>
<input id="fileInput" class="file" type="file" accept="image/*,video/*,.pdf,.txt,.doc,.docx" onchange="uploadFile(this)">
<input id="input" type="text" placeholder="Message DK AI..." autocomplete="off">
<button id="sendBtn" type="button" onclick="sendMessage()">Send</button>
</div>
<div class="small" id="fileStatus"></div>
</footer>
<script>
const chat=document.getElementById("chat"),input=document.getElementById("input"),sendBtn=document.getElementById("sendBtn"),empty=document.getElementById("empty"),fileStatus=document.getElementById("fileStatus");
function addMessage(text,type){if(empty)empty.remove();const d=document.createElement("div");d.className="msg "+type;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
async function sendMessage(){const text=input.value.trim();if(!text)return;addMessage(text,"user");input.value="";sendBtn.disabled=true;const t=document.createElement("div");t.className="msg ai";t.textContent="Typing…";chat.appendChild(t);
try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});const d=await r.json();t.remove();addMessage(d.success?d.reply:"AI error: "+(typeof d.error==="string"?d.error:"Request failed."),"ai")}catch(e){t.remove();addMessage("Server-এর সাথে যোগাযোগ করা যাচ্ছে না।","ai");console.error(e)}finally{sendBtn.disabled=false;input.focus()}}
input.addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});
async function uploadFile(el){const f=el.files[0];if(!f)return;fileStatus.textContent="Uploading: "+f.name;const form=new FormData();form.append("file",f);
try{const r=await fetch("/api/analyze-file",{method:"POST",body:form});const d=await r.json();if(d.reply){addMessage("📎 "+f.name,"user");addMessage(d.reply,"ai");fileStatus.textContent="Uploaded successfully."}else{fileStatus.textContent="File analysis failed.";addMessage("File analysis failed.","ai")}}catch(e){fileStatus.textContent="Server error while uploading.";addMessage("File upload-এর সময় server error হয়েছে।","ai")}el.value=""}
</script>
</body>
</html>
